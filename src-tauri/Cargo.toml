[package]
name = "iso-library"
version = "0.1.0"
description = "ISO Game Library"
authors = ["you"]
edition = "2021"

[package.metadata.bundle]
identifier = "com.isolibrary.app"
icon = [
    "icons/32x32.png",
    "icons/128x128.png",
    "icons/128x128@2x.png",
    "icons/icon.icns",
    "icons/icon.ico",
]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
tauri = { version = "2.11.2", features = ["devtools"] }
tauri-plugin-store = "2.4.3"
tauri-plugin-dialog = "2.7.1"

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

reqwest = { version = "0.13.3", default-features = false, features = [
    "rustls",
    "json",
    "gzip",
    "query",
] }

rusqlite = { version = "0.39.0", features = ["bundled"] }

tokio = { version = "1.52.3", features = ["full"] }

walkdir = "2.5.0"

thiserror = "2.0.18"
log = "0.4.29"
regex-lite = "0.1.9"
# Similarité de chaînes pour le matching de noms de jeux (Jaro-Winkler)
strsim = "0.11.1"

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
